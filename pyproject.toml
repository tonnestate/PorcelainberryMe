[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "porcelainberryme"
version = "0.1.0"
description = "Standalone headless multi-channel and Internet voice communications"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "Proprietary - all rights reserved"}
dependencies = []

[project.optional-dependencies]
sip = ["baresip-python==0.6.0"]
# Optional open-source RTC and local speech recognition only; no model weights,
# paid APIs or cloud accounts. Piper executable/models and Ollama are installed
# separately by the operator only after hardware/capacity review.
voice-local = ["livekit>=1.0,<2.0", "faster-whisper>=1.0,<2.0", "numpy>=1.24,<3.0"]
# Optional local native VAD: no torch, model weights, paid API or new service.
vad = ["webrtcvad-wheels>=2.0.14.post1,<3.0"]
# Optional open-source sender. Browser vendor push endpoints remain external,
# but no cloud AI service, telephony carrier or paid API account is required.
web-push = ["pywebpush>=2.0,<3.0"]

[tool.setuptools.packages.find]
where = ["src"]

[project.scripts]
porcelainberryme = "porcelainberryme.server:main"
