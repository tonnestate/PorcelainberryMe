# Actual WebRTC media integration, not a mocked Python AudioFrame contract.
# Uses a temporary self-hosted LiveKit Docker server on the GitHub runner.
# No LiveKit Cloud account, carrier, API key subscription or telephone number.
name: Self-hosted WebRTC media integration

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  livekit-pcm:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install standalone application and pinned open-source RTC SDK
        run: |
          python -m pip install -e .
          python -m pip install livekit==1.1.21
      - name: Generate private test-only signing credentials
        run: |
          python scripts/generate_local_livekit_config.py --output "$RUNNER_TEMP/pb-local-livekit"
      - name: Start actual local LiveKit server (not LiveKit Cloud)
        run: |
          docker run --rm -d \
            --name porcelainberryme-livekit-ci \
            --network host \
            --mount "type=bind,source=$RUNNER_TEMP/pb-local-livekit/livekit-local.yaml,target=/etc/livekit-ci.yaml,readonly" \
            livekit/livekit-server:v1.13.11 \
            --config /etc/livekit-ci.yaml --bind 127.0.0.1
      - name: Require live signaling server socket before starting WebRTC test
        run: |
          python - <<'PY'
          import socket
          import time
          ready = False
          for _ in range(50):
              try:
                  with socket.create_connection(("127.0.0.1", 7880), timeout=1):
                      ready = True
                      break
              except OSError:
                  time.sleep(0.2)
          if not ready:
              raise SystemExit("Self-hosted LiveKit signaling did not start")
          PY
      - name: Real two-participant WebRTC PCM and authenticated room teardown
        run: |
          set -a
          . "$RUNNER_TEMP/pb-local-livekit/local-media.env"
          set +a
          python scripts/livekit_audio_smoke.py
      - name: Remove ephemeral media container and secret files
        if: always()
        run: |
          docker rm -f porcelainberryme-livekit-ci >/dev/null 2>&1 || true
          rm -rf "$RUNNER_TEMP/pb-local-livekit"
