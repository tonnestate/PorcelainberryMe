name: Offline tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install project only
        run: python -m pip install -e .
      - name: Compile
        run: python -m compileall -q src scripts
      - name: Run offline tests
        run: python -m unittest discover -s tests -v

      - name: Run browser SDK offline tests (Node built-in runner)
        run: node --test clients/browser/*.test.mjs

  mcp-protocol:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install optional MCP SDK (no model downloads)
        run: python -m pip install -e '.[mcp]'
      - name: Exercise real stdio MCP tool discovery
        run: python -m unittest discover -s tests -p 'test_mcp_protocol.py' -v

  asterisk-websocket:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install only local WebSocket protocol dependency
        run: python -m pip install -e . 'aiohttp>=3.9,<4.0'
      - name: Verify Asterisk JSON/slin16 and ARI over real loopback HTTP/WebSocket
        run: |
          python -m unittest discover -s tests -p 'test_asterisk_worker.py' -v
          python -m unittest discover -s tests -p 'test_asterisk_ari.py' -v
